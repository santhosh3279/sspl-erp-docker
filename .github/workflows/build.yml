name: Build & Push SSPL ERPNext Image
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      no_cache:
        description: 'Force rebuild without cache'
        required: false
        type: boolean
        default: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: santhosh3279/frappe_docker
          ref: 9fd1f48ad4eb10d201cec68d00139302e8ca37b4
          path: frappe_docker
      - name: Patch nginx template to keep port in socket.io Origin
        # Upstream sets Origin to ${FRAPPE_SITE_NAME_HEADER} (site name = IP, no port), so on a
        # non-80 port the realtime auth fetch hits :80 and fails. $http_host keeps the port.
        run: |
          f=frappe_docker/resources/core/nginx/nginx-template.conf
          sed -i 's|proxy_set_header Origin $proxy_x_forwarded_proto://${FRAPPE_SITE_NAME_HEADER};|proxy_set_header Origin $proxy_x_forwarded_proto://$http_host;|' "$f"
          grep -qF 'Origin $proxy_x_forwarded_proto://$http_host;' "$f" || { echo "nginx Origin patch failed"; exit 1; }
      - name: Patch Containerfile to build frontend assets + install fonts
        # Fonts go into the final (backend) stage, which every runtime container uses,
        # so wkhtmltopdf / Chrome PDFs have Liberation (Arial/Times/Courier metrics)
        # and Noto (Indic and other scripts) instead of falling back to DejaVu only.
        run: |
          python3 - <<'EOF'
          p = 'frappe_docker/images/custom/Containerfile'
          s = open(p).read()

          stage = 'FROM base AS backend\n'
          fonts = (
              stage
              + '\n'
              + '# Install fonts for PDF rendering (wkhtmltopdf / Chrome)\n'
              + 'USER root\n'
              + 'RUN apt-get update && apt-get install -y --no-install-recommends \\\n'
              + '    fontconfig \\\n'
              + '    fonts-liberation \\\n'
              + '    fonts-noto \\\n'
              + '    fonts-dejavu-core \\\n'
              + '    && fc-cache -f \\\n'
              + '    && rm -rf /var/lib/apt/lists/*\n'
          )
          assert s.count(stage) == 1, 'backend stage not found in Containerfile'
          s = s.replace(stage, fonts)

          old = 'find apps -mindepth 1 -path "*/.git" | xargs rm -fr'
          assert s.count(old) == 1, '.git cleanup line not found in Containerfile'
          # node_modules are build-only, except two that run at runtime:
          #   apps/frappe/node_modules - socketio.js (websocket) and the Website Theme
          #     compiler (generate_bootstrap_theme.js needs sass)
          #   apps/frappe/studio/frontend/node_modules - publishing a custom Studio app,
          #     and bench migrate (after_migrate), run `yarn build-studio-app` there
          # The rest (~2.3 GB: frappe flow/island-toolchain, hrms frontend/roster,
          # erpnext banking, ssplbilling frontend) is dropped once bench build has
          # emitted the dist bundles.
          prune = ('find apps -type d -name node_modules -prune '
                   '! -path apps/frappe/node_modules '
                   '! -path apps/frappe/studio/frontend/node_modules '
                   '-exec rm -rf {} + && \\\n  ')
          s = s.replace(old, 'bench build && \\\n  ' + prune + old)

          # bench init would also build all assets; the explicit bench build above
          # (after common_site_config.json is written) is the only one needed.
          init = '    --no-backups \\\n'
          assert s.count(init) == 1, 'bench init --no-backups line not found in Containerfile'
          s = s.replace(init, init + '    --skip-assets \\\n')

          open(p, 'w').write(s)
          EOF
          grep -nE -A10 '^FROM base AS backend' frappe_docker/images/custom/Containerfile
          grep -n 'bench build' frappe_docker/images/custom/Containerfile
      - name: Patch Containerfile so Studio frontend build finds socketio_port
        # Frappe >= v16.60.0 Studio imports socketio_port from common_site_config.json
        # at build time; the stock Containerfile writes "{}" there, which fails the vite build.
        run: |
          python3 - <<'EOF'
          p = 'frappe_docker/images/custom/Containerfile'
          s = open(p).read()
          old = 'echo "{}" > sites/common_site_config.json'
          new = """echo '{"socketio_port": 9000}' > sites/common_site_config.json"""
          assert old in s, 'common_site_config line not found in Containerfile'
          open(p, 'w').write(s.replace(old, new))
          EOF
          grep -n common_site_config frappe_docker/images/custom/Containerfile
      - name: Validate apps.json
        run: |
          python3 -m json.tool apps.json > /dev/null
          echo "Apps JSON Hash: $(sha256sum apps.json | cut -d' ' -f1)"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/custom/Containerfile
          push: true
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sspl-erpnext:${{ github.event.inputs.version }}
            ghcr.io/${{ github.repository_owner }}/sspl-erpnext:latest
          # Newer frappe_docker reads apps.json from a build secret, not a build-arg.
          # Without it the build still succeeds but the image contains only frappe.
          secret-files: |
            apps_json=${{ github.workspace }}/apps.json
          # Secret contents are not part of the layer cache key and the app branches move,
          # so bust the bench layer on every run to always clone fresh app code.
          build-args: |
            FRAPPE_BRANCH=sspl-version-16
            FRAPPE_PATH=https://github.com/santhosh3279/frappe
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
      - name: Delete old image versions (keep last 3)
        uses: actions/delete-package-versions@v5
        with:
          package-name: sspl-erpnext
          package-type: container
          min-versions-to-keep: 3
